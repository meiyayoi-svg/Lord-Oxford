<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxford English Dictionary - Ebbinghausian Rigour</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- 引入撒花特效庫 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --oed-bg: #020d1d;
            --oed-panel: rgba(8, 23, 46, 0.75);
            --oed-panel-border: rgba(255, 255, 255, 0.12);
            --oed-gold: #d4af37;
            --oed-gold-hover: #f1c40f;
            --oed-red: #d12b2b;
            --oed-blue-accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success-border: rgba(34, 197, 94, 0.4);
            --success-bg: rgba(34, 197, 94, 0.12);
            --danger-border: rgba(239, 68, 68, 0.4);
            --danger-bg: rgba(239, 68, 68, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--oed-bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        .oed-burst-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle at 10% 50%, rgba(20, 45, 85, 0.4) 0%, transparent 60%),
                        radial-gradient(circle at 90% 10%, rgba(15, 30, 60, 0.3) 0%, transparent 50%);
        }

        .oed-burst-svg {
            position: absolute;
            left: -120px;
            top: 50%;
            transform: translateY(-50%);
            width: 650px;
            height: 650px;
            opacity: 0.85;
        }

        .main-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        .oed-brand {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 12px;
        }

        .oed-logo {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 6px;
            color: #ffffff;
            font-family: "EB Garamond", serif;
        }

        .oed-divider {
            width: 2px;
            height: 28px;
            background-color: var(--oed-red);
        }

        .oed-title {
            font-size: 30px;
            font-weight: 400;
            letter-spacing: 1px;
            color: #ffffff;
            font-family: "EB Garamond", serif;
        }

        .hero-subtitle {
            font-size: 15px;
            color: var(--text-muted);
            margin: 8px 0 0 0;
            font-weight: 300;
            font-family: "EB Garamond", serif;
            letter-spacing: 0.8px;
            font-style: italic;
        }

        .glass-panel {
            background: var(--oed-panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--oed-panel-border);
            border-radius: 6px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            padding: 24px;
            margin-bottom: 20px;
        }

        .drop-zone {
            border: 1px dashed rgba(255, 255, 255, 0.25);
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .drop-zone:hover {
            border-color: var(--oed-blue-accent);
            background: rgba(56, 189, 248, 0.04);
        }

        .unit-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            padding: 16px 20px;
        }

        .unit-select {
            padding: 8px 14px;
            border-radius: 4px;
            border: 1px solid var(--oed-panel-border);
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.06);
            cursor: pointer;
            outline: none;
        }

        .unit-select option {
            background: #06152a;
            color: #ffffff;
        }

        .toggle-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .toggle-label {
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            user-select: none;
            transition: all 0.2s;
        }

        .toggle-label:hover {
            border-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .mode-nav {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--oed-panel-border);
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-color: var(--oed-blue-accent);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.15);
        }

        .dashboard {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 16px;
            font-size: 14px;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 20px;
        }

        .stat-val {
            color: #ffffff;
            font-weight: 600;
            margin-left: 4px;
        }

        .stat-btn {
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 4px;
            background: rgba(209, 43, 43, 0.15);
            border: 1px solid rgba(209, 43, 43, 0.3);
            transition: all 0.2s;
        }

        .stat-btn:hover {
            background: rgba(209, 43, 43, 0.25);
        }

        .quiz-card {
            text-align: center;
            padding: 20px 10px;
        }

        .word-display {
            font-size: 46px;
            font-weight: 500;
            color: #ffffff;
            font-family: "EB Garamond", Georgia, serif;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .trans-display {
            font-size: 24px;
            font-weight: 400;
            color: #ffffff;
            font-family: "EB Garamond", serif;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .phonetic {
            font-size: 16px;
            color: var(--oed-blue-accent);
            margin-bottom: 20px;
            font-family: "Inter", sans-serif;
            font-weight: 300;
        }

        .sound-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 400;
            margin-bottom: 28px;
            font-size: 13px;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }

        .sound-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--oed-blue-accent);
        }

        .sound-btn.playing {
            border-color: var(--oed-gold);
            color: var(--oed-gold);
            background: rgba(212, 175, 55, 0.1);
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .option-btn {
            padding: 16px 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.02);
            border-radius: 4px;
            font-size: 15px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.5;
            color: #e2e8f0;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateX(4px);
        }

        .option-btn.correct {
            background: var(--success-bg) !important;
            border-color: var(--success-border) !important;
            color: #4ade80 !important;
        }

        .option-btn.wrong {
            background: var(--danger-bg) !important;
            border-color: var(--danger-border) !important;
            color: #f87171 !important;
        }

        .feedback-banner {
            margin-top: 24px;
            padding: 16px;
            border-radius: 4px;
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
            display: none;
        }

        .feedback-banner.correct-bg {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: #4ade80;
        }

        .feedback-banner.wrong-bg {
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: #f87171;
        }

        .roots-block {
            display: block;
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 4px;
            background: rgba(212, 175, 55, 0.08);
            border-left: 3px solid var(--oed-gold);
            text-align: left;
        }
        .roots-label {
            display: block;
            font-size: 11px;
            color: var(--oed-gold);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .roots-text {
            display: block;
            font-size: 13px;
            color: #e2e8f0;
            line-height: 1.6;
        }
        #cardRootsBlock:empty { margin: 0; }
        #cardRootsBlock { margin: 16px 0 0; }

        .next-btn {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
        }

        .next-btn:hover {
            background: #ffffff;
            color: #020d1d;
        }

        .flashcard {
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .trans-hidden {
            color: var(--text-muted);
            font-style: italic;
            margin-top: 16px;
            font-size: 14px;
        }

        .action-btns {
            display: flex;
            gap: 16px;
            margin-top: 28px;
        }

        .action-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
            color: white;
            font-size: 14px;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }

        .btn-fail { 
            background: rgba(239, 68, 68, 0.2); 
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
        }
        .btn-fail:hover { background: rgba(239, 68, 68, 0.35); }

        .btn-pass { 
            background: rgba(34, 197, 94, 0.2); 
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #4ade80;
        }
        .btn-pass:hover { background: rgba(34, 197, 94, 0.35); }

        .audio-source-note {
            font-size: 12px;
            color: var(--oed-blue-accent);
            margin: 6px 0 0 0;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        /* ---------- 連連看配對模式 ---------- */
        .match-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .match-dir-btn {
            width: auto;
            margin: 0;
            padding: 8px 16px;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .match-dir-btn:hover {
            border-color: var(--oed-blue-accent);
        }
        .match-cols {
            display: flex;
            gap: 12px;
        }
        .match-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .match-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 4px;
            padding: 14px 8px;
            font-size: 13px;
            text-align: center;
            cursor: pointer;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.35;
            color: #e2e8f0;
            transition: all 0.15s ease;
        }
        .match-item:hover:not(.matched) {
            border-color: rgba(255, 255, 255, 0.35);
        }
        .match-item.eng {
            font-family: "EB Garamond", Georgia, serif;
            font-size: 17px;
            color: #ffffff;
        }
        .match-item.selected {
            border-color: var(--oed-gold);
            background: rgba(212, 175, 55, 0.14);
            color: var(--oed-gold);
        }
        .match-item.matched {
            border-color: var(--success-border);
            background: var(--success-bg);
            color: #4ade80;
            opacity: 0.6;
            cursor: default;
        }
        .match-item.wrong {
            border-color: #f87171;
            background: rgba(239, 68, 68, 0.14);
            color: #f87171;
            animation: shakeWrong 0.3s;
        }
        @keyframes shakeWrong {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }
        .match-done {
            text-align: center;
            padding: 30px 10px;
            animation: fadeIn 0.4s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---------- 生詞簿管理彈窗 ---------- */
        .mistake-manage-btn {
            display: block;
            width: 100%;
            margin-top: 6px;
            padding: 4px 0;
            font-size: 11px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            text-decoration: underline;
            cursor: pointer;
        }
        .mistake-manage-btn:hover {
            color: var(--oed-blue-accent);
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-panel {
            background: #06152a;
            border: 1px solid var(--oed-panel-border);
            border-radius: 6px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 480px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-family: "EB Garamond", serif;
            font-size: 18px;
            color: #ffffff;
        }
        .modal-close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }
        .modal-close-btn:hover {
            color: #ffffff;
        }
        .modal-body {
            padding: 12px 20px 20px;
            overflow-y: auto;
        }
        .mistake-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .mistake-row:last-child { border-bottom: none; }
        .mistake-word {
            font-family: "EB Garamond", serif;
            font-size: 17px;
            color: #ffffff;
        }
        .mistake-trans {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .mistake-level {
            font-size: 10px;
            color: var(--oed-blue-accent);
            margin-top: 2px;
        }
        .mistake-del-btn {
            flex-shrink: 0;
            width: 30px; height: 30px;
            border-radius: 4px;
            border: 1px solid rgba(239, 68, 68, 0.4);
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.15s;
        }
        .mistake-del-btn:hover {
            background: rgba(239, 68, 68, 0.25);
        }
    </style>
</head>
<body>

<!-- OED 官方詞源時間軸數據光束 SVG 重繪底板 -->
<div class="oed-burst-bg">
    <svg class="oed-burst-svg" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="200" cy="300" r="140" stroke="#061833" stroke-width="40"/>
        <g opacity="0.6">
            <line x1="200" y1="300" x2="420" y2="120" stroke="#f43f5e" stroke-width="2.5" />
            <line x1="200" y1="300" x2="480" y2="200" stroke="#fb7185" stroke-width="1.5" />
            <line x1="200" y1="300" x2="520" y2="300" stroke="#e879f9" stroke-width="3" />
            <line x1="200" y1="300" x2="490" y2="380" stroke="#38bdf8" stroke-width="2" />
            <line x1="200" y1="300" x2="430" y2="460" stroke="#818cf8" stroke-width="1" />
            <line x1="200" y1="300" x2="350" y2="520" stroke="#f43f5e" stroke-width="2" />
            
            <circle cx="200" cy="300" r="180" stroke="#fb7185" stroke-width="1" stroke-dasharray="2 10" />
            <circle cx="200" cy="300" r="220" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 14" />
            <circle cx="200" cy="300" r="260" stroke="#ffffff" stroke-width="0.8" opacity="0.3" stroke-dasharray="1 8" />
            <circle cx="200" cy="300" r="290" stroke="#e879f9" stroke-width="1.2" stroke-dasharray="6 20" />
        </g>
    </svg>
</div>

<div class="main-wrapper">
    <header>
        <div class="oed-brand">
            <span class="oed-logo">O E D</span>
            <div class="oed-divider"></div>
            <span class="oed-title">Oxford English Dictionary</span>
        </div>
        <p class="hero-subtitle" id="heroSubtitle">Core Vocabulary · Ebbinghausian rigour · 內建連連看配對</p>
        <p class="audio-source-note" id="audioSourceNote">🔊 語音來源偵測中...</p>
    </header>

    <div id="dataLoaderPanel" class="glass-panel" style="display:none; margin-bottom:16px; padding:20px; text-align:center;">
        <p id="dataLoaderMsg" style="margin:0 0 12px; color: var(--text-muted); font-size: 14px;">
            📂 尚未載入詞庫。請選擇（或直接拖曳）一份詞彙 JSON 檔案——<b>檔名不限</b>，不必叫 words.json（格式：word / phonetic / pos / translation / roots 的陣列，任意詞數皆可，每 50 詞自動分為一個單元）。
        </p>
        <input type="file" id="wordsFileInput" accept="application/json,.json" onchange="handleWordsFileInput(event)"
               style="font-size: 14px;">
        <p id="dataLoaderError" style="color:#e05a5a; font-size:13px; margin-top:10px; display:none;"></p>
    </div>

    <div id="mainApp" style="display: none;">
        <div class="glass-panel unit-bar">
            <div>
                <label for="unitSelect" style="font-size: 13px; color: var(--text-muted); margin-right: 8px;">單元範疇:</label>
                <select id="unitSelect" class="unit-select" onchange="onUnitChange()"></select>
                <button type="button" onclick="showDataLoaderPanel()" style="margin-left:10px; font-size:12px; padding:4px 10px; border-radius:8px; border:1px solid var(--text-muted); background:transparent; color:var(--text-muted); cursor:pointer;">🔄 更換詞庫</button>
            </div>

            <div class="toggle-group">
                <label class="toggle-label">
                    <input type="checkbox" id="reverseCheck" onchange="toggleSetting()">
                    <span>🔄 中 ➔ 英逆向</span>
                </label>
                <label class="toggle-label">
                    <input type="checkbox" id="shuffleCheck" onchange="toggleSetting()">
                    <span>🔀 亂序模式</span>
                </label>
                <label class="toggle-label">
                    <input type="checkbox" id="cleanTransCheck" checked onchange="toggleSetting()">
                    <span>📖 COD 精簡釋義</span>
                </label>
            </div>

            <div style="font-size: 13px; color: var(--text-muted);" id="unitProgress">進度: 0 / 50</div>
        </div>

        <div class="mode-nav">
            <button class="mode-btn active" id="btnModeQuiz" onclick="switchMode('quiz')">🎯 詞義辨析特訓</button>
            <button class="mode-btn" id="btnModeCard" onclick="switchMode('card')">🎴 雙面卡片記憶</button>
            <button class="mode-btn" id="btnModeMatch" onclick="switchMode('match')">🔗 連連看配對</button>
        </div>

        <div class="glass-panel" style="padding: 28px;">
            <div class="dashboard">
                <div>已研習詞數: <span class="stat-val" id="statTotal">0</span></div>
                <div>連續正確: <span class="stat-val" style="color: #4ade80;" id="statStreak">0</span></div>
                <div class="stat-btn" title="點擊立即複習到期生詞">
                    <span onclick="startMistakeBook()">💔 生詞簿: <span class="stat-val" style="color: #f87171;" id="statMistakes">0</span></span>
                    <span id="statDue" style="font-size:11px; color:var(--text-muted); display:block; text-align:center; margin-top:2px;" onclick="startMistakeBook()">今日待複習: 0</span>
                    <button class="mistake-manage-btn" onclick="event.stopPropagation(); openMistakeManager()">🗑 管理生詞</button>
                </div>
            </div>

            <div id="mistakeManagerOverlay" class="modal-overlay" style="display:none;" onclick="if(event.target===this) closeMistakeManager()">
                <div class="modal-panel">
                    <div class="modal-header">
                        <span>💔 生詞簿管理</span>
                        <button class="modal-close-btn" onclick="closeMistakeManager()">✕</button>
                    </div>
                    <div class="modal-body" id="mistakeManagerList"></div>
                </div>
            </div>

            <div class="quiz-card" id="cardArea"></div>
        </div>
    </div>
</div>

<script>
    /* ============ 750 詞內嵌詞庫（繁體中文）============ */
    let WORDS = []; // 詞庫由外部 JSON 檔案載入，見 tryAutoLoadWords() / handleWordsFileInput()

    const EBBINGHAUS_INTERVALS = [
        0,                        
        12 * 60 * 60 * 1000,      // 12小時
        24 * 60 * 60 * 1000,      // 1天
        2 * 24 * 60 * 60 * 1000,  // 2天
        4 * 24 * 60 * 60 * 1000,  // 4天
        7 * 24 * 60 * 60 * 1000,  // 7天
        15 * 24 * 60 * 60 * 1000, // 15天
        30 * 24 * 60 * 60 * 1000  // 30天
    ];

    let audioCtx = null;
    function getAudioCtx() {
        if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        return audioCtx;
    }

    // 修復 iPhone 休眠/鎖屏後音頻消失的問題 (全域觸控解鎖機制)
    function unlockAudio() {
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }
    document.addEventListener('touchstart', unlockAudio, { passive: true });
    document.addEventListener('click', unlockAudio, { passive: true });
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden && audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    });

    function playCorrectFx() {
        try {
            const ctx = getAudioCtx();
            if (ctx.state === 'suspended') ctx.resume();
            const now = ctx.currentTime;

            const osc1 = ctx.createOscillator();
            const gain1 = ctx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(659.25, now);
            gain1.gain.setValueAtTime(0.08, now);
            gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
            osc1.connect(gain1);
            gain1.connect(ctx.destination);
            osc1.start(now);
            osc1.stop(now + 0.6);

            const osc2 = ctx.createOscillator();
            const gain2 = ctx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(880.00, now + 0.08);
            gain2.gain.setValueAtTime(0.12, now + 0.08);
            gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.start(now + 0.08);
            osc2.stop(now + 0.8);
        } catch(e) {}
    }

    function playWrongFx() {
        try {
            const ctx = getAudioCtx();
            if (ctx.state === 'suspended') ctx.resume();
            const now = ctx.currentTime;

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(174.61, now); 
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.5);
        } catch(e) {}
    }

    // 「白金漢宮」式按鍵音效：典雅剔透、音量剋制的雙音琴音，端莊而不喧嘩
    function playTileClickSound() {
        try {
            const ctx = getAudioCtx();
            if (ctx.state === 'suspended') ctx.resume();
            const now = ctx.currentTime;
            const notes = [1567.98, 2093.00]; // G6 → C7，高雅泛音組合
            notes.forEach((f, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                const t = now + i * 0.018;
                osc.frequency.setValueAtTime(f, t);
                gain.gain.setValueAtTime(0.032, t);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(t);
                osc.stop(t + 0.14);
            });
        } catch(e) {}
    }

    /* ============ 語音系統：OED 真人音源不提供可嵌入之公開介面，
       故採「系統候選語音（洗牌抽取，保證每輪不重複）→ 有道詞典英式發音」二級降級鏈。
       候選池含 Daniel／Serena／Stephanie／Ava 四個精確名稱之系統語音；
       實際會用到哪幾個，取決於當前裝置／瀏覽器偵測到哪些（例如 Mac 上通常只有
       Daniel＋Serena，iPhone 視使用者下載的語音包而定，可能是 Daniel＋Stephanie＋Ava）。
       抽取規則：把「這台裝置目前偵測到的候選語音」洗牌成一個隊列，依序抽出；
       抽完一輪（即用滿全部候選語音各一次）才重新洗牌，避免連續多次抽到同一個聲音，
       也避免固定死板的順序輪迴。若裝置上一個候選語音都未偵測到，
       一律直接改用有道詞典發音。 ============ */
    const AUDIO_REPEAT_TIMES = 6; // 每次切換單字自動連續播放次數
    const AUDIO_RATE = 0.8;       // 播放語速
    const VOICE_CANDIDATES = [
        { pattern: /daniel/i,    label: 'Daniel（英式男聲）' },
        { pattern: /serena/i,    label: 'Serena（英式女聲）' },
        { pattern: /stephanie/i, label: 'Stephanie（美式女聲）' },
        { pattern: /\bava\b/i,   label: 'Ava（美式女聲）' }
    ];

    let activeAudio = null;
    let isAudioPlayingLoop = false;
    let audioLoopCount = 0;
    let cachedVoices = [];
    let lastVoiceUsed = null; // 記錄「這一次」實際播放所用的語音，供即時顯示
    let voiceBag = [];        // 本輪尚未抽過的候選語音隊列，抽空後才重新洗牌

    function refreshVoiceCache() {
        if ('speechSynthesis' in window) {
            cachedVoices = window.speechSynthesis.getVoices() || [];
        }
    }
    if ('speechSynthesis' in window) {
        refreshVoiceCache();
        // Chrome 常需等 voiceschanged 事件才拿得到完整清單（Safari 通常同步就有），
        // 這裡持續監聽，確保 Chrome 上 Daniel／Serena 不會因為「問太早」而被誤判成不存在。
        window.speechSynthesis.onvoiceschanged = refreshVoiceCache;
    }

    function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    // 回傳「這台裝置目前實際偵測到」的候選語音（SpeechSynthesisVoice 物件陣列）
    function getAvailableCandidateVoices() {
        if (cachedVoices.length === 0) refreshVoiceCache();
        const found = [];
        VOICE_CANDIDATES.forEach(c => {
            const v = cachedVoices.find(v => c.pattern.test(v.name));
            if (v) found.push(v);
        });
        return found;
    }

    // 每次播放都從「本輪尚未抽過」的候選語音隊列中抽一個；隊列抽空後（代表全部候選
    // 語音都已各用過一次）才重新洗牌開始下一輪。裝置上只有 1 個候選語音時等同固定使用；
    // 有 2 個時等同交替；有 3～4 個時保證每輪都不重複、且輪與輪之間的順序不固定。
    function getPreferredVoice() {
        if (!('speechSynthesis' in window)) return null;
        const available = getAvailableCandidateVoices();
        if (available.length === 0) {
            lastVoiceUsed = null;
            updateLiveVoiceNote(null);
            return null;
        }
        if (voiceBag.length === 0) {
            voiceBag = shuffle(available);
        }
        const chosen = voiceBag.shift();
        lastVoiceUsed = chosen;
        updateLiveVoiceNote(chosen);
        return chosen;
    }

    function labelForVoice(voice) {
        const match = VOICE_CANDIDATES.find(c => c.pattern.test(voice.name));
        return match ? match.label : voice.name;
    }

    // 每次實際播放時，即時更新畫面上的語音來源說明，讓使用者能確實看到「這一次」用的是誰
    function updateLiveVoiceNote(chosen) {
        const note = document.getElementById('audioSourceNote');
        if (!note) return;
        if (chosen) {
            note.innerText = `🔊 本次播放使用：系統內建「${chosen.name}」・${labelForVoice(chosen)}`;
        } else {
            note.innerText = `🔊 本次播放使用：有道詞典英式發音（系統未偵測到任何候選語音）`;
        }
    }

    function detectAudioSource() {
        const note = document.getElementById('audioSourceNote');
        if (!note) return;
        setTimeout(() => {
            const available = getAvailableCandidateVoices();
            if (available.length === 0) {
                note.innerText = `🔊 語音來源：有道詞典英式發音（此裝置／瀏覽器未偵測到候選語音，非程式遺漏，屬環境限制）`;
            } else {
                const names = available.map(v => labelForVoice(v)).join('／');
                note.innerText = `🔊 語音來源：偵測到 ${available.length} 個系統語音（${names}），每輪洗牌抽取、輪內不重複，每次播放將即時顯示實際使用者`;
            }
        }, 350);
    }

    function stopAudioLoop() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        if (activeAudio) {
            activeAudio.pause();
            activeAudio.currentTime = 0;
            activeAudio = null;
        }
        isAudioPlayingLoop = false;
        audioLoopCount = 0;
        updateSoundBtnState(false);
    }

    function playAudioContinuous(word, times = AUDIO_REPEAT_TIMES) {
        stopAudioLoop();
        if (!word) return;
        isAudioPlayingLoop = true;
        audioLoopCount = 0;
        updateSoundBtnState(true);

        const voice = getPreferredVoice();

        function playOne() {
            if (!isAudioPlayingLoop || audioLoopCount >= times) {
                stopAudioLoop();
                return;
            }
            if (voice) {
                // 第一順位：macOS 系統 Daniel／Serena 真人語音
                const utter = new SpeechSynthesisUtterance(word);
                utter.voice = voice;
                utter.lang = voice.lang || 'en-GB';
                utter.rate = AUDIO_RATE;
                utter.onend = () => {
                    audioLoopCount++;
                    if (isAudioPlayingLoop && audioLoopCount < times) {
                        setTimeout(playOne, 350);
                    } else {
                        stopAudioLoop();
                    }
                };
                utter.onerror = () => stopAudioLoop();
                window.speechSynthesis.speak(utter);
            } else {
                // 降級方案：有道詞典英式發音
                activeAudio = new Audio(`https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(word)}&type=1`);
                activeAudio.onended = () => {
                    audioLoopCount++;
                    if (isAudioPlayingLoop && audioLoopCount < times) {
                        setTimeout(playOne, 400);
                    } else {
                        stopAudioLoop();
                    }
                };
                activeAudio.play().catch(() => stopAudioLoop());
            }
        }
        playOne();
    }

    function toggleAudio(word) {
        if (isAudioPlayingLoop) stopAudioLoop();
        else playAudioContinuous(word);
    }

    function updateSoundBtnState(isPlaying) {
        const btn = document.getElementById('soundBtn');
        if (btn) {
            if (isPlaying) {
                btn.classList.add('playing');
                btn.innerHTML = `🔊 連續朗讀中... (點擊停止)`;
            } else {
                btn.innerHTML = `🔊 播放標準發音 (連續${AUDIO_REPEAT_TIMES}次)`;
            }
        }
    }

    let allWords = [];
    let currentUnitWords = [];
    let playQueue = [];
    let currentRoundMistakes = []; // 新增：淘汰制錯題池
    let unitSize = 50;
    let currentUnitIndex = 0;
    let currentQuestionIndex = 0;
    let isShuffle = false;
    let isCleanTrans = true;
    let isReverseMode = false;
    let currentMode = 'quiz';
    let currentQuestion = null;
    
    let streakCount = 0;
    let unitPracticedCount = 0;
    let mistakeDict = {};

    function saveState() {
        const state = {
            unitIdx: currentUnitIndex,
            qIdx: currentQuestionIndex,
            mode: currentMode,
            mistakeDict: mistakeDict,
            isShuffle, isReverseMode, isCleanTrans,
            streak: streakCount,
            totalPracticed: unitPracticedCount
        };
        localStorage.setItem('oed_app_state', JSON.stringify(state));
    }

    function loadState() {
        const saved = localStorage.getItem('oed_app_state');
        if (!saved) return;
        try {
            const s = JSON.parse(saved);
            currentUnitIndex = s.unitIdx !== undefined ? s.unitIdx : 0;
            currentQuestionIndex = s.qIdx !== undefined ? s.qIdx : 0;
            currentMode = s.mode || 'quiz';

            mistakeDict = s.mistakeDict || {};

            isShuffle = !!s.isShuffle;
            isReverseMode = !!s.isReverseMode;
            isCleanTrans = s.isCleanTrans !== undefined ? s.isCleanTrans : true;
            streakCount = s.streak || 0;
            unitPracticedCount = s.totalPracticed || 0;

            document.getElementById('shuffleCheck').checked = isShuffle;
            document.getElementById('reverseCheck').checked = isReverseMode;
            document.getElementById('cleanTransCheck').checked = isCleanTrans;
            
            document.getElementById('btnModeQuiz').classList.toggle('active', currentMode === 'quiz');
            document.getElementById('btnModeCard').classList.toggle('active', currentMode === 'card');
            document.getElementById('btnModeMatch').classList.toggle('active', currentMode === 'match');
        } catch(e) {}
    }

    // ============ 詞庫載入機制 ============
    // 支援兩種資料來源，任一成功即可：
    // 1. 自動抓取同目錄下的 words.json（部署到 GitHub Pages／任何網頁伺服器時最方便，
    //    以後只要把新的詞彙 JSON 命名為 words.json 覆蓋上去即可，不必碰這份 html）
    // 2. 若抓取失敗（例如用瀏覽器直接打開本機檔案，file:// 協議下 fetch 本機檔案會被瀏覽器擋下），
    //    自動顯示「選擇檔案」介面，讓使用者手動挑一份 JSON，兩種方式效果完全一樣
    // 接受的 JSON 格式：[{word, phonetic, pos, translation, roots}, ...] 這樣的陣列，
    // 也相容 {"words":[...]}／{"WORDS":[...]}／{"data":[...]} 這種外層包一層的寫法。
    // 不論放多少詞，都會依 unitSize（目前為 50）自動切成一個個單元，無需另外設定。
    function normalizeWordsPayload(raw) {
        if (Array.isArray(raw)) return raw;
        if (raw && Array.isArray(raw.words)) return raw.words;
        if (raw && Array.isArray(raw.WORDS)) return raw.WORDS;
        if (raw && Array.isArray(raw.data)) return raw.data;
        return null;
    }

    function applyLoadedWords(raw, sourceLabel) {
        const list = normalizeWordsPayload(raw);
        if (!list || list.length === 0) {
            showDataLoaderPanel('❌ 這份 JSON 內容看起來不是有效的詞彙陣列，請確認格式（word / translation 等欄位）後再試一次。');
            return false;
        }
        WORDS = list;
        allWords = WORDS.filter(w => w && w.word && w.translation);
        if (allWords.length === 0) {
            showDataLoaderPanel('❌ 檔案讀取成功，但沒有找到任何含 word 與 translation 欄位的有效詞條。');
            return false;
        }
        document.getElementById('dataLoaderPanel').style.display = 'none';
        document.getElementById('heroSubtitle').innerText =
            `${allWords.length} Core Vocabulary · Ebbinghausian rigour · 內建連連看配對${sourceLabel ? '（' + sourceLabel + '）' : ''}`;
        currentUnitIndex = 0;
        currentQuestionIndex = 0;
        initAppUI();
        return true;
    }

    function showDataLoaderPanel(errorMsg) {
        document.getElementById('mainApp').style.display = 'none';
        document.getElementById('dataLoaderPanel').style.display = 'block';
        const errEl = document.getElementById('dataLoaderError');
        if (errorMsg) {
            errEl.innerText = errorMsg;
            errEl.style.display = 'block';
        } else {
            errEl.style.display = 'none';
        }
    }

    function handleWordsFileInput(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const raw = JSON.parse(e.target.result);
                const ok = applyLoadedWords(raw, file.name);
                if (ok) localStorage.setItem(LAST_FILE_KEY, file.name);
            } catch (err) {
                showDataLoaderPanel('❌ 檔案不是合法的 JSON，請檢查格式。錯誤訊息：' + err.message);
            }
        };
        reader.onerror = () => showDataLoaderPanel('❌ 讀取檔案失敗，請重新選擇。');
        reader.readAsText(file, 'utf-8');
    }

    // 依序嘗試以下幾種方式，任何一種成功就直接載入，不限定檔名必須叫 words.json：
    // 1. 網址帶參數指定檔名，例如 index.html?data=myList.json → 直接抓這個檔案
    // 2. 上次在這個瀏覽器成功載入過的檔名（存在 localStorage，重新整理後自動記得）
    // 3. 常見預設檔名 words.json（圖方便的慣例，非強制）
    // 以上都失敗（例如檔名完全沒對上，或用本機 file:// 開啟導致 fetch 被擋），
    // 就顯示檔案選擇器，選擇器本身可以選「任何檔名」的 json，不受限制；
    // 也支援把 json 檔直接拖進頁面。
    const LAST_FILE_KEY = 'oed_last_words_filename';

    function getUrlDataParam() {
        const params = new URLSearchParams(window.location.search);
        return params.get('data') || params.get('json') || params.get('words');
    }

    async function tryFetchJson(filename) {
        try {
            const res = await fetch(filename, { cache: 'no-store' });
            if (!res.ok) return null;
            const raw = await res.json();
            return raw;
        } catch (err) {
            return null;
        }
    }

    async function tryAutoLoadWords() {
        const candidates = [];
        const urlParam = getUrlDataParam();
        if (urlParam) candidates.push(urlParam);
        const lastFile = localStorage.getItem(LAST_FILE_KEY);
        if (lastFile && !candidates.includes(lastFile)) candidates.push(lastFile);
        if (!candidates.includes('words.json')) candidates.push('words.json');

        for (const name of candidates) {
            const raw = await tryFetchJson(name);
            if (raw) {
                const ok = applyLoadedWords(raw, name);
                if (ok) {
                    localStorage.setItem(LAST_FILE_KEY, name);
                    return;
                }
            }
        }
        // 全部候選檔名都沒抓到，顯示檔案選擇器讓使用者手動指定（任何檔名皆可）
        showDataLoaderPanel();
    }

    // 支援把 json 檔直接拖曳到頁面上任何地方來載入，跟點擊選擇器效果一樣
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
        e.preventDefault();
        const file = e.dataTransfer.files && e.dataTransfer.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const raw = JSON.parse(ev.target.result);
                const ok = applyLoadedWords(raw, file.name);
                if (ok) localStorage.setItem(LAST_FILE_KEY, file.name);
            } catch (err) {
                showDataLoaderPanel('❌ 拖入的檔案不是合法的 JSON，請檢查格式。錯誤訊息：' + err.message);
            }
        };
        reader.readAsText(file, 'utf-8');
    });

    window.addEventListener('DOMContentLoaded', () => {
        getAudioCtx(); // 初始化
        loadState();
        tryAutoLoadWords();
        detectAudioSource();
    });

    function getCleanTranslation(text) {
        if (!text) return '';
        if (!isCleanTrans) return text;
        let parts = text.split(/；|;|\n/);
        let trimmed = parts.slice(0, 2).join('；');
        return trimmed.length > 24 ? trimmed.substring(0, 24) + '...' : trimmed;
    }

    function initAppUI() {
        if (allWords.length === 0) return;
        document.getElementById('mainApp').style.display = 'block';

        const select = document.getElementById('unitSelect');
        select.innerHTML = '';
        
        const totalUnits = Math.ceil(allWords.length / unitSize);
        for (let i = 0; i < totalUnits; i++) {
            const start = i * unitSize + 1;
            const end = Math.min((i + 1) * unitSize, allWords.length);
            select.add(new Option(`Unit ${i + 1} (${start}-${end})`, i));
        }

        select.add(new Option(`🔥 全詞庫隨機特訓 (${allWords.length} 詞)`, -1));

        const mistakeOpt = new Option(`💔 生詞簿`, -2);
        mistakeOpt.id = 'mistakeOptionText';
        select.add(mistakeOpt);

        if (currentUnitIndex >= totalUnits && currentUnitIndex !== -1 && currentUnitIndex !== -2) {
            currentUnitIndex = 0;
        }
        select.value = currentUnitIndex;
        loadUnit(currentUnitIndex);
    }

    function startMistakeBook() {
        let now = Date.now();
        let allMistakes = Object.values(mistakeDict);
        let dueMistakes = allMistakes.filter(m => m.nextReview <= now);

        if (allMistakes.length === 0) {
            alert("👏 目前尚無生詞，請繼續保持。");
            return;
        }
        if (dueMistakes.length === 0) {
            alert(`🎉 今日複習任務已完成！\n（尚有 ${allMistakes.length} 個詞彙於記憶週期中，明日請繼續。）`);
            return;
        }
        document.getElementById('unitSelect').value = -2;
        onUnitChange();
    }

    /* ============ 生詞簿管理（手動刪除誤加入的詞）============ */
    function openMistakeManager() {
        renderMistakeManagerList();
        document.getElementById('mistakeManagerOverlay').style.display = 'flex';
    }

    function closeMistakeManager() {
        document.getElementById('mistakeManagerOverlay').style.display = 'none';
    }

    function renderMistakeManagerList() {
        const list = document.getElementById('mistakeManagerList');
        const entries = Object.values(mistakeDict).sort((a, b) => a.nextReview - b.nextReview);

        if (entries.length === 0) {
            list.innerHTML = `<div class="empty-state" style="padding:30px 10px;">🌿 生詞簿目前是空的</div>`;
            return;
        }

        list.innerHTML = entries.map(m => {
            const levelText = m.level > 0 ? `已連對 ${m.level} 輪` : '尚未通過複習';
            return `
                <div class="mistake-row">
                    <div>
                        <div class="mistake-word">${escapeHtml(m.wordObj.word)}</div>
                        <div class="mistake-trans">${escapeHtml(getCleanTranslation(m.wordObj.translation))}</div>
                        <div class="mistake-level">${levelText}</div>
                    </div>
                    <button class="mistake-del-btn" onclick="removeFromMistakeBook('${escapeJs(m.wordObj.word)}')" title="從生詞簿移除此詞">✕</button>
                </div>
            `;
        }).join('');
    }

    function removeFromMistakeBook(word) {
        delete mistakeDict[word];
        saveState();
        updateStats();
        renderMistakeManagerList();
    }

    function toggleSetting() {
        isShuffle = document.getElementById('shuffleCheck').checked;
        isReverseMode = document.getElementById('reverseCheck').checked;
        isCleanTrans = document.getElementById('cleanTransCheck').checked;
        resetUnitQueue();
        if (currentMode === 'match') startMatch();
        else nextQuestion();
        saveState();
    }

    function onUnitChange() {
        const val = parseInt(document.getElementById('unitSelect').value);
        currentQuestionIndex = 0;
        loadUnit(val);
        saveState();
    }

    function loadUnit(unitIdx) {
        currentUnitIndex = parseInt(unitIdx);
        if (currentUnitIndex === -1) {
            currentUnitWords = [...allWords];
        } else if (currentUnitIndex === -2) {
            let now = Date.now();
            let allMistakes = Object.values(mistakeDict);
            let dueMistakes = allMistakes.filter(m => m.nextReview <= now);

            if (allMistakes.length === 0 || dueMistakes.length === 0) {
                alert("無待複習生詞，已自動切換至 Unit 1。");
                document.getElementById('unitSelect').value = 0;
                currentUnitIndex = 0;
                currentUnitWords = allWords.slice(0, unitSize);
            } else {
                currentUnitWords = dueMistakes.map(m => m.wordObj);
            }
        } else {
            const start = currentUnitIndex * unitSize;
            currentUnitWords = allWords.slice(start, start + unitSize);
        }

        resetUnitQueue();
        updateStats();
        if (currentMode === 'match') startMatch();
        else nextQuestion();
    }

    function resetUnitQueue() {
        if (isShuffle) {
            playQueue = [...currentUnitWords].sort(() => Math.random() - 0.5);
        } else {
            playQueue = [...currentUnitWords];
        }
        currentRoundMistakes = []; // 每次重置單元時清空錯題池
        if (currentQuestionIndex >= playQueue.length) currentQuestionIndex = 0;
    }

    function switchMode(mode) {
        currentMode = mode;
        stopAudioLoop();
        document.getElementById('btnModeQuiz').classList.toggle('active', mode === 'quiz');
        document.getElementById('btnModeCard').classList.toggle('active', mode === 'card');
        document.getElementById('btnModeMatch').classList.toggle('active', mode === 'match');
        if (mode === 'match') startMatch();
        else nextQuestion();
        saveState();
    }

    function nextQuestion() {
        stopAudioLoop();
        if (playQueue.length === 0) return;

        let wordObj = playQueue[currentQuestionIndex % playQueue.length];
        let distractors = [];
        while (distractors.length < 3) {
            let rand = allWords[Math.floor(Math.random() * allWords.length)];
            if (rand.word !== wordObj.word && !distractors.some(d => d.word === rand.word)) {
                distractors.push(rand);
            }
        }

        let rawOptions = [wordObj, ...distractors].sort(() => Math.random() - 0.5);
        currentQuestion = {
            wordObj: wordObj,
            options: rawOptions,
            correctIndex: rawOptions.findIndex(o => o.word === wordObj.word)
        };

        if (currentMode === 'quiz') renderQuizMode();
        else renderCardMode();

        playAudioContinuous(wordObj.word);
        saveState();
    }

    function renderQuizMode() {
        const area = document.getElementById('cardArea');
        const q = currentQuestion;
        const optionLetters = ['A', 'B', 'C', 'D'];

        let html = '';
        if (!isReverseMode) {
            html += `<div class="word-display">${escapeHtml(q.wordObj.word)}</div>
                     <div class="phonetic">${escapeHtml(q.wordObj.phonetic || '')}</div>`;
        } else {
            html += `<div style="font-size:13px; color:var(--text-muted); margin-bottom:12px;">請選擇對應之英文單詞：</div>
                     <div class="trans-display">${escapeHtml(getCleanTranslation(q.wordObj.translation))}</div>`;
        }
        
        html += `<button class="sound-btn" id="soundBtn" onclick="toggleAudio('${escapeJs(q.wordObj.word)}')">🔊 播放標準發音 (連續${AUDIO_REPEAT_TIMES}次)</button>
                 <div class="options-grid">`;

        q.options.forEach((opt, idx) => {
            if (!isReverseMode) {
                html += `<button class="option-btn" id="optBtn_${idx}" onclick="checkAnswer(${idx})">
                            <strong style="color:var(--oed-blue-accent); font-family:'EB Garamond',serif; margin-right:6px;">${optionLetters[idx]}.</strong> ${escapeHtml(getCleanTranslation(opt.translation))}
                         </button>`;
            } else {
                html += `<button class="option-btn" id="optBtn_${idx}" onclick="checkAnswer(${idx})">
                            <strong style="color:var(--oed-blue-accent); font-family:'EB Garamond',serif; margin-right:6px;">${optionLetters[idx]}.</strong> 
                            <span style="font-family:'EB Garamond',serif; font-size:20px; color:#ffffff;">${escapeHtml(opt.word)}</span>
                            <span style="color:var(--text-muted); font-size:13px; margin-left:10px;">${escapeHtml(opt.phonetic || '')}</span>
                         </button>`;
            }
        });

        html += `</div>
                 <div class="feedback-banner" id="feedbackBanner"></div>
                 <div id="nextArea" style="display:none;">
                     <button class="next-btn" onclick="onNextClick()">下一題 ➔</button>
                 </div>`;
        
        area.innerHTML = html;
        updateProgressText();
    }

    function handleEbbinghausResult(wordObj, isCorrect) {
        if (isCorrect) {
            streakCount++;
            if (mistakeDict[wordObj.word]) {
                mistakeDict[wordObj.word].level++;
                let newLevel = mistakeDict[wordObj.word].level;
                
                if (newLevel >= EBBINGHAUS_INTERVALS.length) {
                    delete mistakeDict[wordObj.word];
                } else {
                    mistakeDict[wordObj.word].nextReview = Date.now() + EBBINGHAUS_INTERVALS[newLevel];
                }
            }
        } else {
            streakCount = 0;
            // 加入錯題池，以供本輪結尾重新提問 (淘汰制)
            if (!currentRoundMistakes.some(w => w.word === wordObj.word)) {
                currentRoundMistakes.push(wordObj);
            }

            if (mistakeDict[wordObj.word]) {
                mistakeDict[wordObj.word].level = 0;
                mistakeDict[wordObj.word].nextReview = Date.now();
            } else {
                mistakeDict[wordObj.word] = {
                    wordObj: wordObj,
                    level: 0,
                    nextReview: Date.now()
                };
            }
        }
    }

    function renderRootsBlock(wordObj) {
        if (!wordObj || !wordObj.roots) return '';
        return `
            <div class="roots-block">
                <span class="roots-label">🌱 詞根詞源</span>
                <span class="roots-text">${escapeHtml(wordObj.roots)}</span>
            </div>
        `;
    }

    function checkAnswer(selectedIdx) {
        stopAudioLoop();
        const q = currentQuestion;
        const banner = document.getElementById('feedbackBanner');
        const nextArea = document.getElementById('nextArea');

        q.options.forEach((_, idx) => document.getElementById(`optBtn_${idx}`).disabled = true);
        unitPracticedCount++;
        
        if (selectedIdx === q.correctIndex) {
            playCorrectFx(); 
            document.getElementById(`optBtn_${q.correctIndex}`).classList.add('correct');
            handleEbbinghausResult(q.wordObj, true);

            banner.className = 'feedback-banner correct-bg';
            banner.style.display = 'block';
            banner.innerHTML = `
                <div style="font-weight:600; margin-bottom:2px;">✅ 回答正確</div>
                <div><b>${escapeHtml(q.wordObj.word)}</b> ${escapeHtml(q.wordObj.phonetic || '')}：${escapeHtml(q.wordObj.translation)}</div>
                ${renderRootsBlock(q.wordObj)}
            `;
        } else {
            playWrongFx(); 
            document.getElementById(`optBtn_${selectedIdx}`).classList.add('wrong');
            document.getElementById(`optBtn_${q.correctIndex}`).classList.add('correct');

            handleEbbinghausResult(q.wordObj, false);

            banner.className = 'feedback-banner wrong-bg';
            banner.style.display = 'block';
            banner.innerHTML = `
                <div style="font-weight:600; margin-bottom:2px;">❌ 回答錯誤</div>
                <div><b>正確答案：</b> ${escapeHtml(q.wordObj.word)} ${escapeHtml(q.wordObj.phonetic || '')} ➔ ${escapeHtml(q.wordObj.translation)}</div>
                ${renderRootsBlock(q.wordObj)}
            `;
        }

        updateStats();
        nextArea.style.display = 'block';
        saveState();
    }

    function showCelebration() {
        // 華麗撒花特效
        confetti({
            particleCount: 150,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#d4af37', '#38bdf8', '#ffffff']
        });
        
        document.getElementById('cardArea').innerHTML = `
            <div style="padding: 40px 10px; text-align: center; animation: fadeIn 0.5s;">
                <div style="font-size: 60px; margin-bottom: 20px;">🎉</div>
                <h2 style="color: var(--oed-gold); font-family: 'EB Garamond', serif; font-size: 32px; margin-bottom: 16px;">Unit Mastered!</h2>
                <p style="color: #4ade80; font-size: 15px; line-height: 1.6; margin-bottom: 30px;">
                    太棒了！本階段的詞彙已全數通關！<br>
                    沒有任何遺漏的生詞了。
                </p>
                <button class="next-btn" style="background: rgba(56, 189, 248, 0.1); border-color: var(--oed-blue-accent); color: var(--oed-blue-accent);" onclick="onUnitChange()">
                    🔄 再次研習本單元
                </button>
                <button class="next-btn" style="margin-top: 12px; background: #ffffff; color: #020d1d;" onclick="goToNextUnit()">
                    ➡️ 前往下一單元
                </button>
            </div>
        `;
    }

    function goToNextUnit() {
        const select = document.getElementById('unitSelect');
        let nextVal = parseInt(select.value) + 1;
        // 如果到了最後一課（減2是因為有隨機和生詞本選項）
        if (nextVal >= select.options.length - 2) { 
            nextVal = 0; // 回到第一課
        }
        select.value = nextVal;
        onUnitChange();
    }

    function onNextClick() {
        currentQuestionIndex++;
        // 檢查是否已完成當前隊列
        if (currentQuestionIndex >= playQueue.length) {
            // 如果生詞簿研習模式結束
            if (currentUnitIndex === -2) {
                loadUnit(-2);
                return;
            } else {
                // 一般單元模式：檢查錯題池
                if (currentRoundMistakes.length > 0) {
                    // 有錯題！進入錯題循環模式
                    playQueue = [...currentRoundMistakes];
                    if (isShuffle) playQueue.sort(() => Math.random() - 0.5);
                    currentRoundMistakes = []; // 清空準備迎接下一輪可能再錯的
                    currentQuestionIndex = 0;
                } else {
                    // 完美通關，進入撒花畫面！
                    showCelebration();
                    return;
                }
            }
        }
        nextQuestion();
    }

    function renderCardMode() {
        const area = document.getElementById('cardArea');
        const q = currentQuestion;
        let html = `<div class="flashcard" id="frontCard" onclick="flipCard()">`;
        
        if (!isReverseMode) {
            html += `<div class="word-display">${escapeHtml(q.wordObj.word)}</div>
                     <div class="phonetic">${escapeHtml(q.wordObj.phonetic || '')}</div>
                     <button class="sound-btn" id="soundBtn" onclick="event.stopPropagation(); toggleAudio('${escapeJs(q.wordObj.word)}')">🔊 播放發音</button>
                     <div class="trans-hidden" id="cardTrans">點擊卡片翻面，檢視釋義</div>`;
        } else {
            html += `<div style="font-size:13px; color:var(--text-muted); margin-bottom:12px;">請回想對應之英文單詞：</div>
                     <div class="trans-display">${escapeHtml(getCleanTranslation(q.wordObj.translation))}</div>
                     <button class="sound-btn" id="soundBtn" onclick="event.stopPropagation(); toggleAudio('${escapeJs(q.wordObj.word)}')">🔊 播放發音</button>
                     <div class="trans-hidden" id="cardTrans">點擊卡片翻面，檢視單詞</div>`;
        }

        html += `</div>
                 <div id="cardRootsBlock"></div>
                 <div class="action-btns" id="cardActions" style="display:none;">
                     <button class="action-btn btn-fail" onclick="markCard(false)">❌ 尚未掌握</button>
                     <button class="action-btn btn-pass" onclick="markCard(true)">✅ 完整記憶</button>
                 </div>`;
        
        area.innerHTML = html;
        updateProgressText();
        playAudioContinuous(q.wordObj.word);
    }

    function flipCard() {
        const transEl = document.getElementById('cardTrans');
        const q = currentQuestion;
        
        if (!isReverseMode) {
            transEl.className = 'trans';
            transEl.style.fontSize = '20px';
            transEl.style.color = '#ffffff';
            transEl.style.fontFamily = '"EB Garamond", serif';
            transEl.innerText = getCleanTranslation(q.wordObj.translation);
        } else {
            transEl.className = 'trans';
            transEl.style.fontSize = '26px';
            transEl.style.color = '#ffffff';
            transEl.style.fontFamily = '"EB Garamond", serif';
            transEl.innerHTML = `${escapeHtml(q.wordObj.word)} <span style="font-size:15px; color:var(--oed-blue-accent); font-family:sans-serif;">${escapeHtml(q.wordObj.phonetic || '')}</span>`;
        }
        
        document.getElementById('cardActions').style.display = 'flex';
        document.getElementById('frontCard').onclick = null; 

        const rootsEl = document.getElementById('cardRootsBlock');
        if (rootsEl) rootsEl.innerHTML = renderRootsBlock(q.wordObj);
    }

    function markCard(isRemembered) {
        stopAudioLoop();
        unitPracticedCount++;
        const q = currentQuestion;

        if (isRemembered) {
            playCorrectFx();
            handleEbbinghausResult(q.wordObj, true);
        } else {
            playWrongFx();
            handleEbbinghausResult(q.wordObj, false);
        }

        updateStats();
        saveState();
        onNextClick();
    }

    /* ============ 連連看配對模式 ============ */
    let matchWords = [];
    let matchLeft = [];
    let matchRight = [];
    let matchSelectedLeft = null;
    let matchSelectedRight = null;
    let matchMatchedCount = 0;
    let matchDirection = 'EN2CN';
    let matchedSet = new Set();
    let matchWrongPair = { left: null, right: null };

    function shuffleArr(arr) {
        return [...arr].sort(() => Math.random() - 0.5);
    }

    function startMatch() {
        stopAudioLoop();
        let pool = currentUnitWords.length > 0 ? currentUnitWords : allWords;
        if (pool.length < 4) {
            alert('這個範圍詞彙太少，無法配對（至少需要 4 個詞）。');
            return;
        }
        matchWords = shuffleArr(pool).slice(0, Math.min(8, pool.length));
        matchLeft = shuffleArr(matchWords.map(w => ({ word: w.word })));
        matchRight = shuffleArr(matchWords.map(w => ({ word: w.word })));
        matchSelectedLeft = null;
        matchSelectedRight = null;
        matchMatchedCount = 0;
        matchedSet = new Set();
        matchWrongPair = { left: null, right: null };
        renderMatch();
    }

    function toggleMatchDirection() {
        matchDirection = matchDirection === 'EN2CN' ? 'CN2EN' : 'EN2CN';
        startMatch();
    }

    function labelForMatch(word, side) {
        const w = allWords.find(x => x.word === word);
        if (!w) return word;
        const showEnglish = (matchDirection === 'EN2CN' && side === 'left') || (matchDirection === 'CN2EN' && side === 'right');
        return showEnglish ? w.word : getCleanTranslation(w.translation);
    }

    function renderMatch() {
        const area = document.getElementById('cardArea');
        const dirLabel = matchDirection === 'EN2CN' ? '英 → 中' : '中 → 英';

        let html = `
            <div class="match-topbar">
                <span style="font-size:13px; color:var(--text-muted);">配對進度：${matchMatchedCount} / ${matchWords.length} ・ 方向：${dirLabel}</span>
                <button class="match-dir-btn" onclick="toggleMatchDirection()">🔄 切換方向</button>
            </div>
            <div class="match-cols" id="matchCols"></div>
        `;
        area.innerHTML = html;

        const cols = document.getElementById('matchCols');
        const leftCol = document.createElement('div'); leftCol.className = 'match-col';
        const rightCol = document.createElement('div'); rightCol.className = 'match-col';
        cols.appendChild(leftCol);
        cols.appendChild(rightCol);

        matchLeft.forEach(item => {
            const el = document.createElement('div');
            const isEng = (matchDirection === 'EN2CN');
            el.className = 'match-item' + (isEng ? ' eng' : '') + (matchedSet.has(item.word) ? ' matched' : '') + (matchSelectedLeft === item.word ? ' selected' : '') + (matchWrongPair.left === item.word ? ' wrong' : '');
            el.textContent = labelForMatch(item.word, 'left');
            if (!matchedSet.has(item.word)) {
                el.onclick = () => onMatchClick(item.word, 'left');
            }
            leftCol.appendChild(el);
        });
        matchRight.forEach(item => {
            const el = document.createElement('div');
            const isEng = (matchDirection === 'CN2EN');
            el.className = 'match-item' + (isEng ? ' eng' : '') + (matchedSet.has(item.word) ? ' matched' : '') + (matchSelectedRight === item.word ? ' selected' : '') + (matchWrongPair.right === item.word ? ' wrong' : '');
            el.textContent = labelForMatch(item.word, 'right');
            if (!matchedSet.has(item.word)) {
                el.onclick = () => onMatchClick(item.word, 'right');
            }
            rightCol.appendChild(el);
        });

        if (matchWords.length > 0 && matchMatchedCount >= matchWords.length) {
            const done = document.createElement('div');
            done.className = 'match-done';
            done.innerHTML = `
                <div style="font-size:44px; margin-bottom:12px;">🎉</div>
                <p style="color:#4ade80; margin-bottom:20px;">本輪配對完成！</p>
                <button class="next-btn" onclick="startMatch()">🔄 刷下一輪</button>
            `;
            area.appendChild(done);
        }
    }

    function onMatchClick(word, side) {
        playTileClickSound();

        if (side === 'left') {
            matchSelectedLeft = matchSelectedLeft === word ? null : word;
        } else {
            matchSelectedRight = matchSelectedRight === word ? null : word;
        }

        if (matchSelectedLeft && matchSelectedRight) {
            if (matchSelectedLeft === matchSelectedRight) {
                matchedSet.add(matchSelectedLeft);
                matchMatchedCount++;
                matchSelectedLeft = null;
                matchSelectedRight = null;
                playCorrectFx();
                renderMatch();
            } else {
                // 配對錯誤：把兩個被誤配的詞都送入生詞簿（艾賓浩斯排程）
                const wLeft = matchWords.find(w => w.word === matchSelectedLeft);
                const wRight = matchWords.find(w => w.word === matchSelectedRight);
                if (wLeft) handleEbbinghausResult(wLeft, false);
                if (wRight && (!wLeft || wRight.word !== wLeft.word)) handleEbbinghausResult(wRight, false);
                updateStats();
                saveState();
                playWrongFx();

                matchWrongPair = { left: matchSelectedLeft, right: matchSelectedRight };
                renderMatch();
                setTimeout(() => {
                    matchSelectedLeft = null;
                    matchSelectedRight = null;
                    matchWrongPair = { left: null, right: null };
                    renderMatch();
                }, 450);
            }
        } else {
            renderMatch();
        }
    }

    function updateStats() {
        document.getElementById('statTotal').innerText = unitPracticedCount;
        document.getElementById('statStreak').innerText = streakCount;
        
        let now = Date.now();
        let allMistakes = Object.values(mistakeDict);
        let dueCount = allMistakes.filter(m => m.nextReview <= now).length;

        document.getElementById('statMistakes').innerText = allMistakes.length;
        
        const dueEl = document.getElementById('statDue');
        if (dueCount > 0) {
            dueEl.innerText = `今日待複習: ${dueCount}`;
            dueEl.style.color = '#f87171';
            dueEl.style.fontWeight = 'bold';
        } else {
            dueEl.innerText = `今日待複習: 0`;
            dueEl.style.color = 'var(--text-muted)';
            dueEl.style.fontWeight = 'normal';
        }

        const mistakeOpt = document.getElementById('mistakeOptionText');
        if (mistakeOpt) {
            mistakeOpt.innerText = `💔 生詞簿 (${allMistakes.length} 詞)`;
        }
    }

    function updateProgressText() {
        const progressEl = document.getElementById('unitProgress');
        if (progressEl) {
            let poolType = (currentRoundMistakes.length > 0 || playQueue.length < unitSize) && currentUnitIndex !== -2 ? '(錯題回顧) ' : '';
            progressEl.innerText = `進度: ${poolType}${currentQuestionIndex + 1} / ${playQueue.length}`;
        }
    }

    function escapeHtml(unsafe) {
        if (!unsafe) return '';
        return unsafe.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function escapeJs(unsafe) {
         if (!unsafe) return '';
         return unsafe.toString().replace(/'/g, "\\'").replace(/"/g, '\\"');
    }
</script>
